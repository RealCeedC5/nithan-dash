<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nithan Dash · วิ่งแดนนิทาน</title>
<meta name="description" content="Nithan Dash — a pixel-art racing platformer through Thai folk tales. Race bots or up to 3 friends online.">
<meta name="theme-color" content="#1b1430">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231b1430'/%3E%3Cpath d='M3 12h10v2H3z' fill='%23ffd34d'/%3E%3Cpath d='M6 3h4v3H6zM5 6h6v4H5zM5 10h2v2H5zM9 10h2v2H9z' fill='%23ff6a50'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&display=swap">
<style>
  :root {
    --ink: #1b1430; --ink-2: #2a2148; --panel: rgba(27, 20, 48, .92); --line: #4a3f78;
    --gold: #ffd34d; --gold-dk: #e0a020; --red: #ff6a50; --text: #fff8e8; --muted: #c9bfe6;
    --font: "Kanit", "Noto Sans Thai", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0e0a1c; color: var(--text); font-family: var(--font); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #game, #over { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
  #over { pointer-events: none; image-rendering: auto; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; display: none; }
  body.racing #hud { display: block; }
  .hud-tl { position: absolute; left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); line-height: 1; text-shadow: 0 2px 0 #000, 0 0 6px rgba(0,0,0,.6); }
  #hRank { font-size: 44px; font-weight: 700; color: var(--gold); }
  #hRank small { font-size: 18px; color: var(--text); margin-left: 4px; }
  #hTime { font-size: 17px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  #pauseBtn { position: absolute; right: max(12px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); pointer-events: auto; width: 42px; height: 42px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); font-size: 20px; line-height: 1; }
  #itemSlot { position: absolute; right: max(64px, calc(env(safe-area-inset-right) + 64px)); top: max(10px, env(safe-area-inset-top)); width: 58px; height: 58px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; pointer-events: auto; }
  #itemSlot.has { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,211,77,.25); animation: glow 1s infinite alternate; }
  #itemSlot img { width: 42px; height: 42px; image-rendering: pixelated; }
  #itemName { position: absolute; right: max(12px, env(safe-area-inset-right)); top: calc(max(10px, env(safe-area-inset-top)) + 64px); font-size: 13px; text-shadow: 0 1px 0 #000; }
  @keyframes glow { to { box-shadow: 0 0 0 6px rgba(255,211,77,.12); } }
  #big { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: 88px; font-weight: 700; color: var(--gold); text-shadow: 0 5px 0 #000, 0 0 20px rgba(0,0,0,.5); pointer-events: none; white-space: nowrap; }
  #big.pop { animation: pop .5s ease-out; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  #toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); padding: 6px 16px; border-radius: 999px; background: var(--panel); border: 2px solid var(--line); font-size: 16px; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #toast.on { opacity: 1; }
  #intro { position: absolute; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 46px); transform: translateX(-50%); width: min(560px, 90vw); text-align: center; padding: 12px 18px; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); transition: opacity .4s; }
  #intro h2 { margin: 0; font-size: 22px; color: var(--gold); }
  #intro p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  #intro.off { opacity: 0; }

  /* ---------- touch controls ---------- */
  #touch { position: absolute; inset: 0; pointer-events: none; display: none; }
  body.racing.touch #touch { display: block; }
  .tb { position: absolute; pointer-events: auto; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); background: rgba(27,20,48,.45); display: grid; place-items: center; font-size: 26px; font-weight: 700; color: rgba(255,255,255,.9); touch-action: none; }
  .tb.on { background: rgba(255,211,77,.45); border-color: var(--gold); }
  #tLeft { left: max(14px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); width: 78px; height: 78px; }
  #tRight { left: calc(max(14px, env(safe-area-inset-left)) + 90px); bottom: max(18px, env(safe-area-inset-bottom)); width: 78px; height: 78px; }
  #tJump { right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 92px; height: 92px; font-size: 30px; }
  #tSlide { right: calc(max(16px, env(safe-area-inset-right)) + 104px); bottom: max(14px, env(safe-area-inset-bottom)); width: 66px; height: 66px; font-size: 22px; }
  #tItem { right: calc(max(16px, env(safe-area-inset-right)) + 20px); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 104px); width: 62px; height: 62px; font-size: 13px; }
  #tItem img { width: 36px; height: 36px; image-rendering: pixelated; }

  /* ---------- menus ---------- */
  #ui { position: absolute; inset: 0; display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); overflow-y: auto; }
  #ui:empty { display: none; }
  .card { width: min(720px, 100%); background: var(--panel); border: 3px solid var(--line); border-radius: 18px; padding: 22px 24px; box-shadow: 0 10px 0 rgba(0,0,0,.35); max-height: calc(100dvh - 24px); overflow-y: auto; touch-action: pan-y; }
  .card.narrow { width: min(460px, 100%); }
  .logo { text-align: center; margin: 0 0 4px; }
  .logo h1 { margin: 0; font-size: clamp(34px, 7vw, 54px); line-height: 1; color: var(--gold); text-shadow: 0 4px 0 #8a3a1a; letter-spacing: .02em; }
  .logo .th { display: block; font-size: clamp(20px, 4vw, 28px); color: var(--text); text-shadow: 0 3px 0 #000; margin-top: 4px; }
  .tag { text-align: center; color: var(--muted); margin: 6px 0 16px; font-size: 15px; }
  h2.t { margin: 0 0 14px; font-size: 26px; color: var(--gold); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 12px; border: 0; background: var(--gold); color: #2a1408; font-weight: 700; font-size: 17px; box-shadow: 0 4px 0 var(--gold-dk); transition: transform .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dk); }
  .btn.alt { background: var(--ink-2); color: var(--text); box-shadow: 0 4px 0 #120c24; border: 2px solid var(--line); }
  .btn.red { background: var(--red); box-shadow: 0 4px 0 #a83a28; }
  .btn.small { padding: 8px 12px; font-size: 14px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .stack { display: grid; gap: 10px; }
  .menu-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; align-items: start; }
  .chooser { background: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
  .chooser canvas { width: 96px; height: 144px; image-rendering: pixelated; display: block; margin: 0 auto; }
  .chooser .who { font-size: 20px; font-weight: 700; margin: 4px 0; }
  .arrows { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .arrows button { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--ink-2); font-size: 20px; }
  .sw { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .sw button { width: 26px; height: 26px; border-radius: 7px; border: 2px solid rgba(255,255,255,.25); }
  .sw button[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--gold); }
  label.lbl { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; text-align: left; }
  input.txt { width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: #120c24; color: var(--text); font: inherit; font-size: 17px; }
  input.code { text-transform: uppercase; letter-spacing: .3em; font-size: 28px; text-align: center; font-weight: 700; }
  .foot { display: flex; justify-content: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: #120c24; border: 2px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; color: var(--muted); font-weight: 500; }
  .seg button[aria-pressed="true"] { background: var(--gold); color: #2a1408; }
  .levels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .lvl { text-align: left; padding: 0; border: 3px solid var(--line); border-radius: 14px; background: var(--ink); overflow: hidden; }
  .lvl[aria-pressed="true"] { border-color: var(--gold); }
  .lvl canvas { width: 100%; aspect-ratio: 2 / 1; display: block; image-rendering: pixelated; }
  .lvl div { padding: 8px 10px; }
  .lvl b { display: block; font-size: 15px; line-height: 1.25; }
  .lvl small { color: var(--muted); }
  .code-big { font-size: 46px; font-weight: 700; letter-spacing: .25em; color: var(--gold); text-align: center; line-height: 1; padding: 6px 0 2px; }
  .players { display: grid; gap: 8px; margin: 12px 0; }
  .pl { display: flex; align-items: center; gap: 10px; background: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: 6px 10px; }
  .pl canvas { width: 36px; height: 36px; image-rendering: pixelated; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--ink-2); color: var(--muted); }
  .pill.gold { background: var(--gold); color: #2a1408; }
  .res { width: 100%; border-collapse: collapse; margin: 6px 0 12px; }
  .res td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .res tr.me td { background: rgba(255,211,77,.12); }
  .res .pos { font-weight: 700; color: var(--gold); width: 52px; font-size: 20px; }
  .res canvas { width: 30px; height: 30px; image-rendering: pixelated; vertical-align: middle; }
  .res .tm { text-align: right; font-variant-numeric: tabular-nums; }
  .note { color: var(--muted); font-size: 14px; text-align: center; margin: 8px 0 0; }
  .status { min-height: 1.4em; text-align: center; color: var(--gold); margin-top: 8px; }
  .how p { margin: 6px 0; color: var(--muted); }
  .items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .items div { display: flex; gap: 8px; align-items: center; background: var(--ink); border-radius: 10px; padding: 6px 8px; font-size: 14px; }
  .items img { width: 28px; height: 28px; image-rendering: pixelated; }
  .items small { display: block; color: var(--muted); }
  @media (max-width: 640px), (max-height: 520px) {
    .menu-grid { grid-template-columns: minmax(0, 1fr); }
    .card { padding: 16px; }
    .levels, .items { grid-template-columns: minmax(0, 1fr); }
    #hRank { font-size: 34px; }
    #big { font-size: 64px; }
  }
  @media (max-height: 520px) {
    .card { padding: 12px 16px; }
    h2.t { font-size: 21px; margin-bottom: 8px; }
    .res td { padding: 3px 8px; }
    .res .pos { font-size: 16px; }
    .players { margin: 8px 0; gap: 5px; }
    .code-big { font-size: 36px; }
    .foot { margin-top: 8px; }
  }
  @media (max-height: 520px) and (min-width: 600px) {
    .menu-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
    .levels { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .logo h1 { font-size: 32px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="over"></canvas>

<div id="hud">
  <div class="hud-tl"><div id="hRank"></div><div id="hTime"></div></div>
  <button id="itemSlot" type="button" aria-label="Use item"></button>
  <div id="itemName"></div>
  <button id="pauseBtn" type="button" aria-label="Pause">❚❚</button>
  <div id="big"></div>
  <div id="toast"></div>
  <div id="intro" class="off"></div>
</div>

<div id="touch">
  <button class="tb" id="tLeft" type="button" aria-label="Left">◀</button>
  <button class="tb" id="tRight" type="button" aria-label="Right">▶</button>
  <button class="tb" id="tSlide" type="button" aria-label="Slide">▼</button>
  <button class="tb" id="tJump" type="button" aria-label="Jump">▲</button>
  <button class="tb" id="tItem" type="button" aria-label="Use item"></button>
</div>

<div id="ui"></div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/race.js"></script>
<script src="js/net.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
